# Dominio: iem3255.istecnomed.com
# Copiar a /etc/nginx/sites-available/iem3255-dashboard
# y luego: ln -s /etc/nginx/sites-available/iem3255-dashboard /etc/nginx/sites-enabled/
#
# IMPORTANTE: a diferencia de wnology-dashboard, este DNS quedó SIN el proxy
# de Cloudflare (nube gris/"DNS only", no naranja) — el navegador conecta
# directo a la IP del droplet. Eso significa que el certificado de origen de
# Cloudflare NO sirve aquí: ese certificado solo lo confía el propio
# Cloudflare, no los navegadores, así que si lo usas sin el proxy delante
# vas a tener un error de certificado no confiable. En su lugar usamos un
# certificado público real de Let's Encrypt (gratis, vía certbot).
#
# Este archivo trae solo el bloque HTTP inicial — el bloque HTTPS lo agrega
# automáticamente `certbot --nginx` en el paso 5 del README (certbot detecta
# este server_name y reescribe el archivo agregando `listen 443 ssl` con las
# rutas al certificado). No hace falta escribir el bloque 443 a mano.
#
# Nota: si en el mismo droplet ya tienes wnology-dashboard corriendo con su
# propio server_name (otro subdominio), este bloque puede convivir sin
# problema — Nginx enruta por server_name, y cada app Node escucha en su
# propio puerto en 127.0.0.1 (3000 la de WNOLOGY, 3001 esta).

server {
    listen 80;
    listen [::]:80;
    server_name iem3255.istecnomed.com;

    # Proxy a la app Node (estáticos + /api + /ws, todo en un solo puerto)
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # necesario para que el WebSocket (/ws) funcione a través del proxy
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
